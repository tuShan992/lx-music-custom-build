<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>LX Music 自定义构建</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body { margin: 0; font: 13px/1.5 -apple-system, "PingFang SC", "Segoe UI", "Microsoft YaHei", sans-serif; background: #1e1e1e; color: #ddd; }
  header { padding: 14px 18px; background: #252526; border-bottom: 1px solid #333; font-size: 15px; font-weight: 600; color: #4ec9b0; }
  main { padding: 16px 18px; display: flex; flex-direction: column; gap: 14px; height: calc(100vh - 51px); }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  label { color: #aaa; }
  select, button { background: #333; color: #eee; border: 1px solid #444; border-radius: 4px; padding: 6px 10px; font: inherit; }
  button { cursor: pointer; }
  button:hover { background: #3d3d3d; }
  button.primary { background: #0e639c; border-color: #0e639c; }
  button.primary:hover { background: #1177bb; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  #patches { display: flex; flex-direction: column; gap: 4px; padding: 8px 10px; background: #252526; border: 1px solid #333; border-radius: 4px; }
  #patches label { color: #ddd; }
  pre { flex: 1; margin: 0; padding: 10px; background: #111; color: #ccc; border: 1px solid #333; border-radius: 4px; overflow: auto; white-space: pre-wrap; word-break: break-all; font-family: Menlo, Consolas, monospace; font-size: 12px; }
  #status { color: #999; min-height: 18px; }
  #status.ok { color: #4ec9b0; }
  #status.err { color: #f48771; }
  #progressRow { gap: 10px; }
  #progressWrap { flex: 1; height: 6px; background: #333; border-radius: 3px; overflow: hidden; }
  #progressBar { height: 100%; width: 0; background: #0e639c; transition: width .2s; }
  #progressText { color: #999; font-size: 12px; min-width: 90px; text-align: right; }
</style>
</head>
<body>
  <header>LX Music 自定义构建</header>
  <main>
    <div class="row">
      <label>上游版本</label>
      <select id="tag"><option>加载中…</option></select>
      <button id="refresh">刷新版本</button>
      <button id="fetch" class="primary">获取最新源码</button>
    </div>

    <div>
      <label>选择要应用的补丁</label>
      <div id="patches"></div>
    </div>

    <div class="row">
      <label>打包目标</label>
      <select id="pack">
        <option value="pack:mac">macOS x64 + arm64 (dmg)</option>
        <option value="pack:mac:dmg">macOS x64 (dmg)</option>
        <option value="pack:mac:dmg:arm64">macOS arm64 (dmg)</option>
        <option value="pack:win:setup:x64">Windows x64 (exe)</option>
        <option value="pack:linux:appImage">Linux (AppImage)</option>
      </select>
      <button id="run" class="primary">应用补丁并构建</button>
      <button id="open">打开产物目录</button>
    </div>

    <div id="status"></div>
    <div class="row" id="progressRow">
      <div id="progressWrap"><div id="progressBar"></div></div>
      <span id="progressText">0%</span>
    </div>
    <pre id="log"></pre>
  </main>
  <script src="renderer.js"></script>
</body>
</html>
